name: Publish NKEVT website
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Import the initial website files
        if: ${{ hashFiles('index.html') == '' }}
        run: |
          unzip -q NKEVT_HTML_CSS_JS.zip
          test -f index.html
          touch .nojekyll
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- .nojekyll *.html styles.css script.js assets
          git commit -m 'Add editable NKEVT website source files'
          git push origin HEAD:main
      - name: Prepare the public site
        run: |
          mkdir /tmp/nkevt-pages
          cp -r -- .nojekyll *.html styles.css script.js assets /tmp/nkevt-pages/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/nkevt-pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
